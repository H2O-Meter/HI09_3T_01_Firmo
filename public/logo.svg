<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" fill="none">
  <defs>
    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FD7600" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Dynamic Orange Brushstroke Background (#FD7600 / #FF7700) matching logomarca_reestilizada.png -->
  <g filter="url(#subtle-glow)">
    <!-- Main Brush Splash Body -->
    <path d="M 180 320
             C 140 270, 180 180, 310 130
             C 410 90, 560 160, 710 200
             C 800 225, 880 260, 935 295
             C 960 310, 955 330, 915 345
             C 840 375, 740 405, 620 440
             C 500 475, 380 540, 240 545
             C 170 548, 120 525, 95 480
             C 75 440, 90 410, 130 395
             C 100 375, 80 345, 110 310
             C 130 285, 160 300, 180 320 Z" 
          fill="#FD7600" />

    <!-- Top Right Brush Tail Streaks -->
    <path d="M 760 215 
             C 820 230, 895 260, 950 280 
             C 930 285, 860 270, 780 250 Z" 
          fill="#FD7600" />
    <path d="M 680 435 
             C 780 440, 870 410, 915 390 
             C 860 415, 770 445, 660 445 Z" 
          fill="#FD7600" />

    <!-- Left Splatter/Bristle Details -->
    <path d="M 120 490 
             C 80 525, 60 565, 45 590 
             C 40 580, 55 540, 85 500 Z" 
          fill="#FD7600" />
    <path d="M 85 415 
             C 45 440, 20 470, 10 500 
             C 15 475, 40 440, 75 410 Z" 
          fill="#FD7600" />
    <path d="M 60 360 
             C 30 375, 15 400, 5 425 
             C 15 405, 35 380, 60 360 Z" 
          fill="#FD7600" />
    <path d="M 90 315 
             C 65 305, 40 315, 25 335 
             C 40 325, 65 320, 85 325 Z" 
          fill="#FD7600" />
  </g>

  <!-- Lettering: Escola Parque Ipiranga in Deep Forest Green (#016E01 / #006800) -->
  <g fill="#006A00" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900">
    <!-- Top Line: Escola with slight tilt -->
    <text x="510" y="275" font-size="115" letter-spacing="-1.5px" transform="rotate(-3 510 275)" style="paint-order: stroke fill; stroke: #004D00; stroke-width: 4px; stroke-linejoin: round;">
      Escola
    </text>
    
    <!-- Bottom Line: Parque Ipiranga -->
    <text x="500" y="405" font-size="108" letter-spacing="-2px" transform="rotate(-3 500 405)" style="paint-order: stroke fill; stroke: #004D00; stroke-width: 4px; stroke-linejoin: round;">
      Parque Ipiranga
    </text>
  </g>
</svg>
